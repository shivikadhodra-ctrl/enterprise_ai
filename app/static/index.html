<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise AI Knowledge Assistant</title>
<style>
  :root {
    color-scheme:light;
    --bg:#f4f7fb;
    --card:#fff;
    --muted:#64748b;
    --acc:#2563eb;
    --text:#172033;
    --border:#e2e8f0;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; background:var(--card); border-bottom:1px solid var(--border); font-size:20px; font-weight:700; }
  main { display:grid; grid-template-columns:minmax(260px,320px) minmax(0,1fr); align-items:start; gap:24px; padding:28px 24px; max-width:1180px; margin:0 auto; }
  @media (max-width:800px){ main{grid-template-columns:1fr;padding:20px 16px;} }
  .card { min-width:0; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:0 4px 18px rgba(15,23,42,.04); }
  h3 { margin:0 0 16px; font-size:15px; color:#334155; text-transform:uppercase; letter-spacing:.05em; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:10px 16px; font:inherit; font-size:14px; font-weight:650; cursor:pointer; transition:background .15s,transform .15s; }
  button:hover:not(:disabled) { background:#1d4ed8; transform:translateY(-1px); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid rgba(37,99,235,.25); outline-offset:2px; }
  button:disabled { opacity:.55; cursor:wait; }
  input[type=text] { min-width:0; flex:1; padding:11px 12px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; color:var(--text); font:inherit; }
  input[type=file] { min-width:0; flex:1; color:var(--muted); font-size:13px; }
  input[type=file]::file-selector-button { margin-right:8px; padding:8px 10px; border:1px solid var(--border); border-radius:7px; background:#f8fafc; color:#334155; cursor:pointer; }
  .doc { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px; overflow-wrap:anywhere; }
  .doc small { color:var(--muted); display:block; margin-top:3px; }
  .doc a { flex:none; color:#dc2626; cursor:pointer; font-size:12px; font-weight:600; }
  #chat { min-height:320px; max-height:55vh; overflow:auto; display:flex; flex-direction:column; gap:12px; margin-bottom:16px; padding:4px 2px; }
  .msg { max-width:88%; padding:11px 14px; border-radius:12px; line-height:1.5; white-space:pre-wrap; }
  .u { background:#dbeafe; color:#1e3a8a; align-self:flex-end; border-bottom-right-radius:4px; }
  .a { background:#f1f5f9; border:1px solid var(--border); border-bottom-left-radius:4px; }
  .src { font-size:12px; color:var(--muted); margin-top:8px; }
  .row { display:flex; align-items:center; gap:10px; }
  select { background:#fff; color:var(--text); border:1px solid #cbd5e1; border-radius:8px; padding:10px; width:100%; margin-bottom:10px; font:inherit; }
</style>
</head>
<body>
<header>📚 Enterprise AI Knowledge Assistant</header>
<main>
  <section class="card">
    <h3>Documents</h3>
    <div class="row" style="margin-bottom:12px">
      <input type="file" id="file" accept="application/pdf">
      <button id="up" onclick="upload()">Upload</button>
    </div>
    <div id="status" style="font-size:13px;color:var(--muted);margin-bottom:8px"></div>
    <div id="docs"></div>
  </section>
  <section class="card">
    <h3>Ask a question</h3>
    <select id="scope"><option value="">All documents</option></select>
    <div id="chat"></div>
    <div class="row">
      <input type="text" id="q" placeholder="e.g. What is the leave policy?" onkeydown="if(event.key==='Enter')ask()">
      <button id="ask" onclick="ask()">Ask</button>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function loadDocs() {
  const docs = await (await fetch('/documents')).json();
  $('docs').innerHTML = docs.map(d =>
    `<div class="doc"><div>${esc(d.filename)}<small>${d.pages} pages · ${d.chunks} chunks</small></div>
     <a onclick="del('${d.id}')">delete</a></div>`).join('') || '<small style="color:var(--muted)">No documents yet</small>';
  $('scope').innerHTML = '<option value="">All documents</option>' +
    docs.map(d => `<option value="${d.id}">${esc(d.filename)}</option>`).join('');
}
async function upload() {
  const f = $('file').files[0]; if (!f) return;
  const fd = new FormData(); fd.append('file', f);
  $('up').disabled = true; $('status').textContent = 'Uploading & indexing...';
  const r = await fetch('/upload', {method:'POST', body: fd});
  const j = await r.json();
  $('status').textContent = r.ok ? `Indexed ${j.filename} (${j.chunks} chunks)` : `Error: ${j.detail}`;
  $('up').disabled = false; $('file').value = ''; loadDocs();
}
async function del(id) { await fetch('/documents/' + id, {method:'DELETE'}); loadDocs(); }
function add(cls, html) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  $('chat').appendChild(d); $('chat').scrollTop = 1e9; return d;
}
async function ask() {
  const q = $('q').value.trim(); if (!q) return;
  $('q').value = ''; add('u', esc(q));
  const wait = add('a', '…thinking');
  const r = await fetch('/ask', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({question: q, doc_id: $('scope').value || null})});
  const j = await r.json();
  if (!r.ok) { wait.innerHTML = 'Error: ' + esc(j.detail || 'request failed'); return; }
  const src = j.sources.map((s,i) => `[${i+1}] ${esc(s.filename)} p.${s.page} (score ${s.score})`).join('<br>');
  wait.innerHTML = esc(j.answer) + (src ? `<div class="src"><b>Sources (${j.mode})</b><br>${src}</div>` : '');
}
loadDocs();
</script>
</body>
</html>
